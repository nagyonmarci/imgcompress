services:
  imgcompress:
    image: karimz1/imgcompress:latest
    container_name: imgcompress
    restart: always
    ports:
      - "3001:5000"
    environment:
      # Set to true to remove the mascot and enable a minimal, mascot-free UI
      - DISABLE_LOGO=false
      # Set to true to disable the storage management features (e.g., for your users to not see all the files)
      - DISABLE_STORAGE_MANAGEMENT=false
    healthcheck:
      test: ["CMD", "python", "/container/healthcheck.py"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Optional MCP sidecar — opt-in via: docker compose --profile mcp up -d
  # Exposes the imgcompress REST API as MCP tools over SSE on port 9090.
  # Configure your MCP client (e.g. Claude Desktop) with: http://localhost:9090/sse
  imgcompress-mcp:
    profiles: ["mcp"]
    image: karimz1/imgcompress-mcp:latest
    build:
      context: ./mcp
      dockerfile: Dockerfile
    container_name: imgcompress-mcp
    restart: always
    depends_on:
      imgcompress:
        condition: service_healthy
    ports:
      - "9090:9090"
    environment:
      - IMGCOMPRESS_URL=http://imgcompress:5000
      - MCP_TRANSPORT=sse
      - MCP_PORT=9090
